[package]
name = "music-now"
version = "0.1.0"
authors = ["LDprg <lukas_4dr@gmx.at>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
dioxus = { version = "0.7", features = ["router", "fullstack"] }
dioxus-free-icons = { version = "0.10", features = ["hero-icons-solid"] }
m3u8-rs = { version = "6.0", optional = true }
regex = { version = "1.12", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "http2",
    "http3",
    "json",
    "rustls-tls",
    "system-proxy",
    "zstd",
] }
scraper = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", default-features = false, optional = true }
rodio = { git = "https://github.com/RustAudio/rodio", branch = "feat/comprehensive-seeking-and-bit-depth", optional = true }
format_serde_error = "0.3"
bytes = "1.10.1"
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }
web-time = { version = "1.1.0", optional = true }

[features]
default = []
web = ["dioxus/web", "gloo-timers", "web-time"] # Development only
desktop = ["dioxus/desktop", "tokio/time"]
mobile = ["dioxus/mobile", "tokio/time"]
server = [
    "dioxus/server",
    "tokio/full",
    "dep:rodio",
    "dep:scraper",
    "dep:m3u8-rs",
    "dep:regex",
]

[profile]

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
