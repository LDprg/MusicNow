[package]
name = "music-now"
version = "0.1.0"
authors = ["LDprg <lukas_4dr@gmx.at>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.2", features = ["router", "fullstack"] }
dioxus-free-icons = { version = "0.9", features = ["hero-icons-solid"] }
dioxus-ssr = "0.6.2"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
