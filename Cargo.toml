[package]
name = "music-now"
version = "0.1.0"
authors = ["LDprg <lukas_4dr@gmx.at>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.2", features = ["router", "fullstack"] }
dioxus-free-icons = { version = "0.9", features = ["hero-icons-solid"] }
dioxus-ssr = "0.6.2"
m3u8-rs = { version = "6.0.0", optional = true }
regex = { version = "1.11.3", optional = true }
reqwest = { version = "0.12.23", features = [
    "json",
    "rustls-tls",
    "trust-dns",
] }
rodio = { version = "0.21.1", features = ["symphonia-all"], optional = true }
scraper = { version = "0.24.0", optional = true }
serde_json = { version = "1.0.145", optional = true }
tokio = { version = "1.47.1", features = ["full"], optional = true }

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = [
    "dioxus/server",
    "dep:tokio",
    "dep:rodio",
    "dep:m3u8-rs",
    "dep:scraper",
    "dep:regex",
    "dep:serde_json",
]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
