[package]
name = "musicnow"
version = "0.1.0"
authors = ["LDprg <lukas_4dr@gmx.at>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
dioxus = { version = "0.7.1", features = ["router"] }
dioxus-free-icons = { version = "0.10", features = ["hero-icons-solid"] }
m3u8-rs = "6.0"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = [
    "system-proxy",
    "rustls-tls",
    "http2",
    "charset",
    "json",
    "deflate",
    "gzip",
    "brotli",
    "zstd",
] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
rodio = { git = "https://github.com/RustAudio/rodio", branch = "feat/comprehensive-seeking-and-bit-depth", features = [
    "symphonia-all",
    "symphonia-simd",
] }
format_serde_error = "0.3"
bytes = "1.11"
directories = "6.0"
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }
strum = { version = "0.27", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["serde"] }
toml = "0.9"
md-5 = "0.10"
base16ct = { version = "0.3", features = ["alloc"] }
bincode = { version = "2.0", features = ["serde"] }

[features]
default = []
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile", "dep:jni", "dep:ndk-context"]

[profile.release]
codegen-units = 1
lto = "thin"

[profile.android-dev]
inherits = "dev"
